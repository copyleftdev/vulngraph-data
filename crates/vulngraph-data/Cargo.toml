[package]
name = "vulngraph-data"
version = "0.1.0"
edition = "2024"
description = "VulnGraph data pipeline: ingest sources, build the graph database, package and publish data releases"

[[bin]]
name = "vulngraph-data"
path = "src/main.rs"

[dependencies]
# Pinned engine tag defines the on-disk binary format (Law 1). Bumping the
# pin is a deliberate format-sync act — see docs/data-releases.md.
vulngraph-engine = { git = "https://github.com/copyleftdev/vulngraph", tag = "engine-v0.1.0" }
fnv = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
quick-xml = "0.37"
sha2 = "0.10"
hex = "0.4"
tar = "0.4"
flate2 = "1"

[dev-dependencies]
tempfile = "3"
